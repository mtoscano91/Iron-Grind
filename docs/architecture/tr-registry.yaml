requirements:
  # --- auth: design/gdd/authentication.md (production/epics/authentication/EPIC.md) ---
  - id: TR-auth-001
    system: auth
    gdd: design/gdd/authentication.md
    requirement: "Full authentication = credential verification + AccountID→CharacterID resolution + session token issuance, all three complete before any game operation is permitted (CR-AUTH-1)"
    created: 2026-08-11
    revised: ""
    status: active
  - id: TR-auth-002
    system: auth
    gdd: design/gdd/authentication.md
    requirement: "`AccountID` is a `readonly struct` wrapping `uint`; `AccountID(0)` reserved/invalid; monotonic server-side counter, never reused, persisted independently from `CharacterID`'s counter (CR-AUTH-2/3)"
    created: 2026-08-11
    revised: ""
    status: active
  - id: TR-auth-003
    system: auth
    gdd: design/gdd/authentication.md
    requirement: "Authentication runs outside the Unity IL2CPP binary and off the zone tick, in the .NET gateway process (ADR-016): HTTPS through Caddy for clients, loopback TCP link to zones; no sidecar, no named pipes (CR-AUTH-4)"
    created: 2026-08-11
    revised: "2026-11-06"
    status: active
  - id: TR-auth-004
    system: auth
    gdd: design/gdd/authentication.md
    requirement: "Password hashing via Argon2id (`Konscious.Security.Cryptography`), minimum `iterations=2, memorySize=19456KB, parallelism=1`, PHC string storage, 16-byte salt; bcrypt explicitly rejected (72-byte truncation defect) (CR-AUTH-5)"
    created: 2026-08-11
    revised: ""
    status: active
  - id: TR-auth-005
    system: auth
    gdd: design/gdd/authentication.md
    requirement: "Client sends plaintext credentials over TLS only; server hashes on receipt; client MUST NOT pre-hash; server MUST reject non-TLS connections (CR-AUTH-6)"
    created: 2026-08-11
    revised: ""
    status: active
  - id: TR-auth-006
    system: auth
    gdd: design/gdd/authentication.md
    requirement: "Gateway-only registration validation in CR-AUTH-8 step 2 order (username normalized with ToLowerInvariant, length then ASCII [a-z0-9_]; password length; character name length in code points, [A-Za-z0-9_], not equal to the username; playable class), first failure wins; F-AUTH-1 lockout as a table lookup keyed F - LOGIN_FAILURE_LIMIT, capped at the last entry (CR-AUTH-7, CR-AUTH-13, F-AUTH-1)"
    created: 2026-11-06
    revised: ""
    status: active

  # --- cp: design/gdd/character-persistence.md (production/epics/character-persistence/EPIC.md) ---
  - id: TR-cp-001
    system: cp
    gdd: design/gdd/character-persistence.md
    requirement: "CR-CP-1 — the `ICharacterPersistence` async interface (`LoadCharacter`, `CreateStub`, `SaveSession`, `SaveIrreversibleOutcome`) and its result types"
    created: 2026-10-12
    revised: ""
    status: active
  - id: TR-cp-002
    system: cp
    gdd: design/gdd/character-persistence.md
    requirement: "CR-CP-2 — the character record schema: 23 logical fields, some not persisted"
    created: 2026-10-12
    revised: ""
    status: active
  - id: TR-cp-003
    system: cp
    gdd: design/gdd/character-persistence.md
    requirement: "CR-CP-3 — the load sequence, in its exact order (stat initialisation before equipment re-registration); `LoadCharacter` fetches and validates only (async), `ApplyLoadedRecord` does every write synchronously on the tick thread"
    created: 2026-10-12
    revised: "2026-10-15"
    status: active
  - id: TR-cp-004
    system: cp
    gdd: design/gdd/character-persistence.md
    requirement: "CR-CP-4 — save triggers: all saves are event-driven, no periodic save; every `SaveIrreversibleOutcome` writes the whole record"
    created: 2026-10-12
    revised: "2026-10-15"
    status: active
  - id: TR-cp-005
    system: cp
    gdd: design/gdd/character-persistence.md
    requirement: "CR-CP-5 — the `SaveIrreversibleOutcome` failure protocol: caller rollback, session preservation, disconnect"
    created: 2026-10-12
    revised: ""
    status: active
  - id: TR-cp-006
    system: cp
    gdd: design/gdd/character-persistence.md
    requirement: "CR-CP-6 — one transaction per save; `SaveVersion` + 1 on every write; zero rows affected → `ConcurrencyConflict`; no partial write, no retry; after a write with an unknown outcome the next write re-reads the stored `SaveVersion`"
    created: 2026-10-12
    revised: "2026-10-15"
    status: active
  - id: TR-cp-007
    system: cp
    gdd: design/gdd/character-persistence.md
    requirement: "CR-CP-7 — at most one save in flight per `CharacterID`; a second call is queued; the snapshot is taken before the queue; `SaveSession` takes its expected `SaveVersion` at call time, `SaveIrreversibleOutcome` at its turn"
    created: 2026-10-12
    revised: "2026-10-15"
    status: active
  - id: TR-cp-008
    system: cp
    gdd: design/gdd/character-persistence.md
    requirement: "CR-CP-8 — `CHARACTER_LOAD_TIMEOUT_SECONDS = 10` on `LoadCharacter`"
    created: 2026-10-12
    revised: ""
    status: active
  - id: TR-cp-009
    system: cp
    gdd: design/gdd/character-persistence.md
    requirement: "CR-CP-9 — `CreateStub` writes a complete Level 1 record at registration; no first-login path in `LoadCharacter`"
    created: 2026-10-12
    revised: ""
    status: active
  - id: TR-cp-010
    system: cp
    gdd: design/gdd/character-persistence.md
    requirement: "CR-CP-10 — the `SaveSession` step sequence: steps 2–6 read in-memory state on the tick thread, then step 1 takes the save slot, then step 7 commits atomically; `SaveIrreversibleOutcome` runs steps 2–7 the same way"
    created: 2026-10-12
    revised: "2026-10-15"
    status: active
  - id: TR-cp-011
    system: cp
    gdd: design/gdd/character-persistence.md
    requirement: "CR-CP-11 — CR-CP-5 applies to `SaveIrreversibleOutcome` failures only; `SaveSession` failures follow CR-NET-5.5"
    created: 2026-10-12
    revised: ""
    status: active
  - id: TR-cp-012
    system: cp
    gdd: design/gdd/character-persistence.md
    requirement: "CR-CP-12 — `PendingPurchase` in its own `pending_purchases` table, outside the character record"
    created: 2026-10-12
    revised: ""
    status: active
  - id: TR-cp-013
    system: cp
    gdd: design/gdd/character-persistence.md
    requirement: "F-CP-2 — `SaveVersion` increment on every write"
    created: 2026-10-12
    revised: ""
    status: active

  # --- stats: design/gdd/character-stats.md (production/epics/character-stats/EPIC.md) ---
  - id: TR-stats-001
    system: stats
    gdd: design/gdd/character-stats.md
    requirement: "Modifier stack applies flat bonuses first, then percentage bonuses multiplicatively; result clamped to StatMin/StatMax last"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-stats-002
    system: stats
    gdd: design/gdd/character-stats.md
    requirement: "Percentage bonuses within the same modifier layer are additive (not compounding): two +10% bonuses = +20%, not +21%"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-stats-003
    system: stats
    gdd: design/gdd/character-stats.md
    requirement: "CurrentHP and CurrentMP are protected from the modifier stack; MaxHP decrease immediately clamps CurrentHP; MaxHP increase grants no HP restoration"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-stats-004
    system: stats
    gdd: design/gdd/character-stats.md
    requirement: "`ApplyDamage` at CurrentHP=0 is a no-op; `OnEntityDied` fires exactly once at CurrentHP=0.0; overkill clamps at 0.0, never negative"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-stats-005
    system: stats
    gdd: design/gdd/character-stats.md
    requirement: "`OnStatChanged` broadcast uses C# `event Action<StatChangedArgs>` with struct args — no per-emit heap allocation on the server tick path"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-stats-006
    system: stats
    gdd: design/gdd/character-stats.md
    requirement: "All gameplay systems query stats live on demand at point of use; no system other than HUD holds a cached stat value"
    created: 2026-07-02
    revised: ""
    status: active

  # --- currency: design/gdd/currency-system.md (production/epics/currency-system/EPIC.md) ---
  - id: TR-currency-001
    system: currency
    gdd: design/gdd/currency-system.md
    requirement: "`TrySpendGold(amount)` — server-side, atomic; returns false without modifying balance if `gold_balance < amount` (no overdraft)"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-currency-002
    system: currency
    gdd: design/gdd/currency-system.md
    requirement: "`AddGold(amount, GoldTransactionReason)` — logs reason enum on every call; `CompensatingRefund` used for reconnect refunds and failure rollbacks"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-currency-003
    system: currency
    gdd: design/gdd/currency-system.md
    requirement: "`gold_version` provides optimistic concurrency for concurrent save conflicts; `rows-affected = 0` → `ConcurrencyConflict` result"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-currency-004
    system: currency
    gdd: design/gdd/currency-system.md
    requirement: "Client holds read-only display copy of gold balance, received via state sync — client never writes gold balance"
    created: 2026-07-02
    revised: ""
