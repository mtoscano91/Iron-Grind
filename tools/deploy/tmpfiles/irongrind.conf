# /run/irongrind: per-zone env files written by the gateway (ADR-016 Decision 3; Gateway Story 008).
# Install: /etc/tmpfiles.d/irongrind.conf, then `systemd-tmpfiles --create irongrind.conf` (also runs at every boot).
# Owner gateway (writes the files); no access for others. systemd reads the files as root when it starts a zone unit.
# Type Path            Mode User    Group   Age
d      /run/irongrind  0750 gateway gateway -
