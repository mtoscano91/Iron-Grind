  # --- stats: design/gdd/character-stats.md (production/epics/character-stats/EPIC.md) ---
  - id: TR-stats-001
    system: stats
    gdd: design/gdd/character-stats.md
    requirement: "Modifier stack applies flat bonuses first, then percentage bonuses multiplicatively; result clamped to StatMin/StatMax last"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-stats-002
    system: stats
    gdd: design/gdd/character-stats.md
    requirement: "Percentage bonuses within the same modifier layer are additive (not compounding): two +10% bonuses = +20%, not +21%"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-stats-003
    system: stats
    gdd: design/gdd/character-stats.md
    requirement: "CurrentHP and CurrentMP are protected from the modifier stack; MaxHP decrease immediately clamps CurrentHP; MaxHP increase grants no HP restoration"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-stats-004
    system: stats
    gdd: design/gdd/character-stats.md
    requirement: "`ApplyDamage` at CurrentHP=0 is a no-op; `OnEntityDied` fires exactly once at CurrentHP=0.0; overkill clamps at 0.0, never negative"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-stats-005
    system: stats
    gdd: design/gdd/character-stats.md
    requirement: "`OnStatChanged` broadcast uses C# `event Action<StatChangedArgs>` with struct args — no per-emit heap allocation on the server tick path"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-stats-006
    system: stats
    gdd: design/gdd/character-stats.md
    requirement: "All gameplay systems query stats live on demand at point of use; no system other than HUD holds a cached stat value"
    created: 2026-07-02
    revised: ""
    status: active

