# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: F1_EquipmentSellPrice
    status: active
    source: design/gdd/item-database.md
    referenced_by:
      - design/gdd/item-database.md
      - design/gdd/loot-table-system.md
    expression: "SellPriceGold = TierBasePrice(GearTier)"
    variables:
      - "TierBasePrice: {Bronze=10, Iron=30, Steel=90, DarkSteel=270} gold"
    output_range: [10, 270]
    notes: "Authoring guide only — not a runtime formula. SellPriceGold is authored directly. Validation warns on >±5% deviation. Rarity multiplier removed in review pass 1 (2026-04-24). DarkSteel sell price (270g) confirmed 2026-05-22: Enhancement System economy validation (F-ENH-5) verified destruction-recovery ratio ≈ 14,667× — DarkSteel scroll investment dominates item value. OQ-8 closed. IRON RANGE CORRECTION APPLIED (2026-05-23): Equipment System F-EQS-2 Iron flat bonus range corrected to 22–28 (was 16–22) to satisfy F-ENH-3 parity constraint. Bronze→Iron Δ=0 ✓, Iron→Steel Δ=+8 ✓, Steel→DarkSteel Δ=+4 ✓."
    added: "2026-04-23"
    revised: "2026-05-22"

  - name: F4_PctBonusCap
    status: deprecated
    source: design/gdd/item-database.md
    referenced_by:
      - design/gdd/item-database.md
    expression: "PctBonus(modifier) ∈ [0.0, PctBonusCap(Rarity)]"
    variables:
      - "PctBonusCap: {Common=0.0, Uncommon=0.05, Rare=0.15, Epic=0.25}"
    output_range: [0.0, 0.25]
    notes: "REMOVED in review pass 1 (2026-04-24). Rarity and PctBonus on equipment were removed from MVP. All MVP equipment uses flat bonuses only (ΣPctEquip = 0). May be reintroduced in VS."
    added: "2026-04-23"
    revised: "2026-04-24"

  - name: F-DC-1_PhysicalMitigation
    status: active
    source: design/gdd/damage-calculation.md
    referenced_by:
      - design/gdd/damage-calculation.md
    expression: "PhysicalMitigated = max(BaseDamage × MIN_DAMAGE_FRACTION, BaseDamage − Defense)"
    variables:
      - "BaseDamage: int, attacker's AttackPower, range [1, 9999]"
      - "Defense: int, target's GetEffectiveStat(Defense), range [0, 9999]"
      - "MIN_DAMAGE_FRACTION: 0.05 (tuning constant)"
    output_range: [1, 9999]
    notes: "Flat subtraction model. At Defense=0 returns BaseDamage exactly. At Defense≥BaseDamage the 5% floor fires. Result is float; floored to int in F-DC-3/F-DC-4."
    added: "2026-04-25"
    revised: ""

  - name: F-DC-2_ElementalMitigation
    status: active
    source: design/gdd/damage-calculation.md
    referenced_by:
      - design/gdd/damage-calculation.md
    expression: "ElementalMitigated = ElementalBonus × max(MIN_ELEMENTAL_FRACTION, 1 − MagicDefense / (MagicDefense + K_MAGIC))"
    variables:
      - "ElementalBonus: int, weapon's flat elemental damage from Item Database, range [0, 9999]"
      - "MagicDefense: int, target's GetEffectiveStat(MagicDefense), range [0, 9999]"
      - "K_MAGIC: 200 (tuning constant — MagicDefense value at which 50% elemental is absorbed)"
      - "MIN_ELEMENTAL_FRACTION: 0.10 (tuning constant — 10% elemental floor)"
    output_range: [0, 9999]
    notes: "Hyperbolic soft cap. At MagicDefense=0 returns ElementalBonus exactly. At MagicDefense=200 returns 50% of ElementalBonus. At MagicDefense=9999 returns ~10% (clamped by MIN_ELEMENTAL_FRACTION floor). ElementalBonus=0 always returns 0.0."
    added: "2026-04-25"
    revised: ""

  - name: F-DC-3_CritApplication
    status: active
    source: design/gdd/damage-calculation.md
    referenced_by:
      - design/gdd/damage-calculation.md
    expression: "FinalDamage = Mathf.FloorToInt(PreCritDamage × (IsCrit ? CritMultiplier : 1.0f)) where PreCritDamage = PhysicalMitigated + ElementalMitigated"
    variables:
      - "PhysicalMitigated: float output of F-DC-1"
      - "ElementalMitigated: float output of F-DC-2"
      - "CritMultiplier: float, attacker's GetEffectiveStat(CritMultiplier), range [1.0, 3.0]"
      - "IsCrit: bool, determined by server RNG roll < CritChance"
    output_range: [0, 59994]
    notes: "Mitigation-first order: mitigation applied before crit multiplier. Crit is exactly CritMultiplier × mitigated damage. Max theoretical: BaseDamage=9999, Defense=0, ElementalBonus=9999, CritMultiplier=3.0 → (9999+9999)×3=59994. Uses Mathf.FloorToInt (not System.Math.Floor) — IL2CPP requirement. Output fed into F-DC-4 for absolute floor."
    added: "2026-04-25"
    revised: ""

  - name: F-DC-4_AbsoluteMinimumFloor
    status: active
    source: design/gdd/damage-calculation.md
    referenced_by:
      - design/gdd/damage-calculation.md
    expression: "FinalDamage = max(1, Mathf.FloorToInt(PreCritDamage × CritOrNot))"
    variables:
      - "PreCritDamage: float sum of F-DC-1 + F-DC-2 outputs"
    output_range: [1, 59994]
    notes: "Load-bearing at BaseDamage < 20: Mathf.FloorToInt(BaseDamage × 0.05) truncates to 0 for BaseDamage in [1,19]. The absolute-1 floor prevents zero damage from being applied and incorrectly triggering a kill. Not a safety net — a required correction for valid stat ranges."
    added: "2026-04-25"
    revised: ""

  - name: F-LS-1_XpThreshold
    status: active
    source: design/gdd/leveling-system.md
    referenced_by:
      - design/gdd/leveling-system.md
    expression: "XP(L) = Mathf.RoundToInt(C × L^α × R^L)"
    variables:
      - "L: int, target level, range [1, 59]"
      - "C: float = 178.6 (base coefficient — primary tuning lever for overall XP scale)"
      - "α: float = 0.648 (polynomial exponent — controls early-game growth)"
      - "R: float = 1.1198 (exponential base ≈ e^0.1132 — controls late-game acceleration)"
    output_range: [200, 2000000]
    notes: "HUD bar fill = (Experience − XpThreshold[Level]) / (XpThreshold[Level+1] − XpThreshold[Level]). Sentinel XpThreshold[61] = int.MaxValue — array must be declared with length ≥ 62. C, α, R calibrated together against anchors L1=200, L20=12173, L59≈2,000,000 — retune as a system, not individually. Party System GDD must confirm Mathf.RoundToInt as the float→int conversion for F-LS-2 output before AddExperience() calls."
    added: "2026-04-27"
    revised: ""

  - name: F-LS-2_PartyXpBonus
    status: deprecated
    source: design/gdd/leveling-system.md
    referenced_by:
      - design/gdd/leveling-system.md
    expression: "XP_member = XP_base × (1.0f + PartyBonusIncrement × (N − 1))"
    variables:
      - "XP_base: int, kill XP from F-LS-1 lookup, range [200, 2000000]"
      - "N: int, party members within XP range, range [1, 4]"
      - "PartyBonusIncrement: float = 0.10 (additive per extra member)"
    output_range_multiplier: "[×1.0 (solo) to ×1.30 (full party of 4)]"
    notes: "SUPERSEDED BY F-PS-1_PartyXpDeduction (2026-05-16). Party System GDD authored F-PS-1 with opposite direction — a detriment (10% less per additional member). F-PS-1 is the canonical formula. leveling-system.md must mark this formula superseded in a propagation pass (HIGH priority — tracked in session-state). N range [1,4] for MAX_PARTY_SIZE=4. Party System GDD confirmed Mathf.RoundToInt as float→int conversion."
    added: "2026-04-27"
    revised: "2026-05-17"

  - name: F-CS-1_RespecFloor
    status: active
    source: design/gdd/class-system.md
    referenced_by:
      - design/gdd/class-system.md
      - design/gdd/leveling-system.md
    expression: "FloorValue(stat) = BASE_ATTR + (Level − 1) × AutoAllocIncrement[stat]"
    variables:
      - "BASE_ATTR: int = 10 (base attribute value at L1, same for all stats and classes)"
      - "Level: int, character's current level, range [1, 60]"
      - "AutoAllocIncrement[stat]: int, class auto-alloc rate for the stat (0, 1, or 2), from ClassDefinition"
    output_range: [10, 128]
    notes: "Lower bound for free-point placement after a respec — free points cannot be set below this floor for any stat. At L1 the floor equals BASE_ATTR=10 for all stats. Maximum: 10 + 59×2 = 128 (L60 Warrior STR or Healer INT at auto-alloc rate 2). Leveling System GDD CR-4.3 references this formula for respec boundary enforcement. Class System is the sole authority on AutoAllocIncrement values; Leveling System must read them from IClassRegistry.TryGetClass(), not hardcode them (OQ-CS-4 BLOCKING)."
    added: "2026-04-27"
    revised: ""

  - name: F-ENH-1_EnhancementFlatBonus
    status: active
    source: design/gdd/enhancement-system.md
    referenced_by:
      - design/gdd/enhancement-system.md
      - design/gdd/equipment-system.md
    expression: "EnhancedFlatBonus(modifier, level) = modifier.FlatBonus + (level × BonusPerLevel[GearTier])"
    variables:
      - "modifier.FlatBonus: int, base flat bonus from Item Database StatModifiers[], range varies by tier"
      - "level: int, current enhancement level, range [0, MAX_ENHANCEMENT_LEVEL=10]"
      - "BonusPerLevel: {Bronze=3, Iron=4, Steel=6, DarkSteel=10} per modifier"
    output_range: [8, 168]
    notes: "Output feeds IEnhancementBonusProvider.GetFlatBonus(). Equipment System must use this interface instead of raw Item Database FlatBonus when computing AddEquipmentModifier values. Upper bound: DarkSteel max base (68) + 10×10 = 168. Bronze min base (8) + 0×3 = 8. These bounds include +10, which has very low practical probability. Output_range corrected 2026-05-23 (was 212 — derived from a pre-revision formula; correct derivation gives 168)."
    added: "2026-05-22"
    revised: ""

  - name: F-ENH-2_EnhancementElementalBonus
    status: active
    source: design/gdd/enhancement-system.md
    referenced_by:
      - design/gdd/enhancement-system.md
      - design/gdd/damage-calculation.md
    expression: "EnhancedElementalDamage(level) = item.ElementalDamage + (level × ElementalBonusPerLevel[GearTier])"
    variables:
      - "item.ElementalDamage: int, weapon's base elemental damage from Item Database, range [0, 9999]"
      - "level: int, current enhancement level, range [0, MAX_ENHANCEMENT_LEVEL=10]"
      - "ElementalBonusPerLevel: {Bronze=1, Iron=2, Steel=3, DarkSteel=5} for weapons; returns 0 for non-weapons"
    output_range: [0, 9999]
    notes: "Output feeds IEnhancementBonusProvider.GetElementalBonus(). Damage Calculation F-DC-2 must use the enhanced value, not the raw Item Database ElementalDamage. Damage Calculation must obtain the level from Equipment.GetEquippedWeaponEnhancementLevel(): byte. Non-weapon items always return 0."
    added: "2026-05-22"
    revised: ""

  - name: F-ENH-3_TierParityConstraint
    status: active
    source: design/gdd/enhancement-system.md
    referenced_by:
      - design/gdd/enhancement-system.md
      - design/gdd/equipment-system.md
    expression: "midpoint(T) + 5 × BonusPerLevel[T] ≈ midpoint(T+1)"
    variables:
      - "midpoint(T): float, midpoint of tier T's flat bonus range per modifier"
      - "BonusPerLevel[T]: int, from F-ENH-1 table"
    notes: "Parity invariant: a +5 item of tier T has approximately the same stat total as a +0 item of tier T+1. VERIFIED for Bronze→Iron (exact, Δ=0), Steel→DarkSteel (Δ=+4), Iron→Steel (Δ=+8, surplus acceptable). IRON RANGE CORRECTION APPLIED (2026-05-23): Equipment System F-EQS-2 Iron flat bonus range corrected to 22–28 (was 16–22). Changing BonusPerLevel values invalidates this constraint and requires re-verification plus re-derivation of the Iron range."
    added: "2026-05-22"
    revised: ""

  - name: F-PS-1_PartyXpDeduction
    status: active
    source: design/gdd/party-system.md
    referenced_by:
      - design/gdd/party-system.md
    expression: "XP_member = Mathf.RoundToInt(Mathf.Max(0f, XP_base × (1.0f - XP_PARTY_DEDUCTION_RATE × (N_eligible − 1))))"
    variables:
      - "XP_base: int, kill XP from F-LS-1 lookup, range [200, 2000000]"
      - "N_eligible: int, members in same zone + within ±5 of leader level + not Ghost/OutOfZone, range [1, 4]"
      - "XP_PARTY_DEDUCTION_RATE: float = 0.10"
    output_range_multiplier: "[×0.70 (N=4) to ×1.00 (N=1)]"
    guard: "If N_eligible = 0: award 0 XP to all members, do not evaluate formula — unguarded at N=0 produces ×1.10 (a bug). Mathf.Max(0f,...) catches negative multipliers if tuning knobs are pushed beyond joint constraint."
    notes: "Canonical party XP formula. Party System CR-PS-5 calls AddExperience(EntityID, int) per eligible member after each kill. Supersedes F-LS-2_PartyXpBonus (leveling-system.md) which uses opposite direction (bonus). leveling-system.md must defer to this formula in a propagation pass. Uses Mathf.RoundToInt (IL2CPP requirement — not System.Math.Round; uses round-half-away-from-zero, NOT banker's rounding). Solo (N=1): ×1.00. Full party (N=4, MVP): ×0.70 per kill, but higher kill throughput keeps net XP/hour favourable. Joint constraint: XP_PARTY_DEDUCTION_RATE × (MAX_PARTY_SIZE − 1) < 1.0."
    added: "2026-05-16"
    revised: "2026-05-16"

