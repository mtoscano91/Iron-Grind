# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: visual_element_transform_setter
    status: active
    description: "Do not use VisualElement.transform setter for positional animation. Use element.style.translate = new StyleTranslate(new Translate(x, y)) instead."
    why: "VisualElement.transform setter was deprecated in Unity 6.2 and produces a compile warning. In Unity 6.3 it is effectively removed. All UI Toolkit positional animation must use style.translate, style.rotate, or style.scale."
    adr: docs/architecture/ADR-005-hud-ui-framework-ui-toolkit.md
    added: 2026-06-20

  - pattern: picking_mode_parent_inheritance
    status: active
    description: "Do not rely on PickingMode.Ignore set on a parent VisualElement to make children non-interactive. Set PickingMode.Ignore (or USS picking-mode: ignore) explicitly on every non-interactive leaf element."
    why: "PickingMode.Ignore does NOT propagate down the VisualElement tree. Children with the default PickingMode.Position remain in the hit-test tree and will silently consume touches over their bounding rect, blocking input from reaching the 3D scene. On a touch-only iOS game this produces untraceable input bugs."
    adr: docs/architecture/ADR-005-hud-ui-framework-ui-toolkit.md
    added: 2026-06-20

  - pattern: entity_framework_core_for_persistence
    status: active
    description: "Do not use Entity Framework Core for character or transaction persistence. Use Npgsql + Dapper with explicit parameterised SQL."
    why: "EF Core's reflection footprint requires extensive link.xml entries for IL2CPP and introduces change-tracking overhead with no benefit for a fixed 23-field schema where every save is a full-record UPDATE. The ICharacterPersistence interface already provides the abstraction layer — EF Core adds complexity without value."
    adr: docs/architecture/ADR-006-persistence-layer.md
    added: 2026-06-27

  - pattern: unity_relay_for_dedicated_server
    status: active
    description: "Do not use Unity Gaming Services Relay for server-to-client UDP connectivity. Use a direct NGO UDP connection to the server's public IP and port."
    why: "Unity Relay is a NAT traversal service for P2P topologies. A dedicated server on a public IP does not need NAT traversal. Routing all traffic through Unity's relay datacenter adds ~20–50ms RTT per hop, conflicting with the commit-before-broadcast latency budget (ENHANCEMENT_PROCESS_LATENCY_MAX_MS = 200ms) and defeating the purpose of co-locating PostgreSQL for low write latency."
    adr: docs/architecture/ADR-007-hosting-backend.md
    added: 2026-06-27

  - pattern: deprecated_ui_event_api_names
    status: active
    description: "Do not use pre-Unity-6.0 UI Toolkit event override names: ExecuteDefaultAction, ExecuteDefaultActionAtTarget, PreventDefault(). Use HandleEventTrickleDown, HandleEventBubbleUp, StopPropagation() respectively."
    why: "Unity 6.0 renamed these methods. The old names are deprecated and generate compile warnings; they may be removed in a future version. All combat UI and HUD interaction code must use the 6.0+ names to prevent warning accumulation and future breakage."
    adr: docs/architecture/ADR-008-combat-ui-framework.md
    added: 2026-06-27

  - pattern: direct_visually_element_from_network_behaviour
    status: active
    description: "Do not write directly to a VisualElement from a NetworkBehaviour callback. Use SkillBarPresenter or an equivalent MonoBehaviour presenter with a Queue<T> to decouple network callbacks from VisualElement updates."
    why: "Coupling NetworkBehaviour to VisualElement makes the UI logic untestable without a running NGO session and couples the network and UI layers — changes to VisualElement structure require edits in the network layer. The presenter pattern (SkillBarPresenter : MonoBehaviour) keeps these layers independent per ADR-008."
    adr: docs/architecture/ADR-008-combat-ui-framework.md
    added: 2026-06-27

  - pattern: scene_handle_as_int
    status: active
    description: "Do not cache Scene.handle as an int or store it in any int-typed field or variable. Always cache loaded scenes as Scene structs (e.g., Scene _zoneScene = SceneManager.GetActiveScene())."
    why: "Scene.handle changed from int to SceneHandle in Unity 6.3 LTS (6000.4). Any precompiled assembly that references Scene.handle as an int will throw MissingFieldException at runtime without a compile-time error. Project code must use Scene struct identity throughout to remain safe across Unity 6.3 precompiled assembly constraints."
    adr: docs/architecture/ADR-009-scene-zone-load-management.md
    added: 2026-06-27

  - pattern: central_event_bus
    status: active
    description: "Do not introduce a central EventBus, MessageBus, or publish-subscribe singleton for cross-system communication. Use injected I[System]Service interfaces (point-to-point) or C# event Action<T> with readonly struct args (broadcast) instead."
    why: "A central EventBus singleton creates hidden dependencies (nothing shows what subscribes to what without grep), allocates a managed object per Publish() call (GC pressure at server tick rate), and is not unit-testable without a running bus instance. ADR-010 closes this pattern in favour of direct injection + C# events."
    adr: docs/architecture/ADR-010-event-messaging-architecture.md
    added: 2026-06-27

  - pattern: lambda_capture_persistent_subscription
    status: active
    description: "Do not use lambda expressions for persistent event subscriptions (event +=). Use named instance methods only. Lambda captures on long-lived subscriptions prevent GC of closed-over references and cannot be unsubscribed by reference."
    why: "A lambda capture like `_combat.OnMobDied += ctx => ProcessDeath(ctx.MobEntityId)` cannot be unsubscribed without storing the delegate. If the subscriber outlives the zone instance, the producer holds a reference that prevents GC. Named methods are required so that Dispose() can -= the same delegate reference."
    adr: docs/architecture/ADR-010-event-messaging-architecture.md
    added: 2026-06-27

  - pattern: urp_setup_render_passes_loading_screen
    status: active
    description: "Do not use SetupRenderPasses in any loading-screen or zone-transition rendering code. Use AddRenderPasses + RecordRenderGraph (URP render graph API) if a custom URP pass is ever required on a loading screen."
    why: "SetupRenderPasses was deprecated in Unity 6.2 and URP Compatibility Mode was fully removed in Unity 6.3. Any custom URP rendering pass written with SetupRenderPasses will not compile or run correctly in Unity 6.3+. The loading overlay implementation (FullScreenLoadingOverlay using UI Toolkit VisualElement) avoids this entirely — if a custom URP pass is ever added, it must use the render graph API."
    adr: docs/architecture/ADR-009-scene-zone-load-management.md
    added: 2026-06-27

