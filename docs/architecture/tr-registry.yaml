  - id: TR-nav-001
    system: nav
    gdd: design/gdd/navigation-pathfinding.md
    requirement: "`IZoneNavigation` lifecycle: `Initialize(ZoneID, NavMeshDataInstance)` takes the instance the scene loader added (ADR-009 A1) and aborts zone initialisation if it is invalid; `Teardown` disables agents, clears dictionaries, then removes the NavMesh data; `_tornDown` guard; main thread only; one zone per process (CR-NAV-1 to 3, EC-NAV-4, EC-NAV-6, AC-NAV-01 to 03)"
    created: 2026-11-12
    revised: ""
    status: active
  - id: TR-nav-002
    system: nav
    gdd: design/gdd/navigation-pathfinding.md
    requirement: "A pool of `MAX_AGENT_POOL_SIZE` (150) `NavMeshAgent` objects is filled at `Initialize` with `updatePosition`, `updateRotation` and `autoBraking` false, no obstacle avoidance, and disabled; no `Instantiate` or `Destroy` during gameplay (CR-NAV-4, AC-NAV-04)"
    created: 2026-11-12
    revised: ""
    status: active
  - id: TR-nav-003
    system: nav
    gdd: design/gdd/navigation-pathfinding.md
    requirement: "An agent is claimed on `MobEventBus.MobSpawned` (Warp to spawn, speed from `IMobDefinitionRegistry`, stopped) and released on `MobEventBus.MobDied` (ResetPath, disable, return to pool); a double claim and pool exhaustion log an error without throwing (CR-NAV-5, CR-NAV-6, EC-NAV-2, EC-NAV-3, AC-NAV-05 to 07, 22)"
    created: 2026-11-12
    revised: ""
    status: active
  - id: TR-nav-004
    system: nav
    gdd: design/gdd/navigation-pathfinding.md
    requirement: "`INavigationProvider`: `SetDestination` queues with latest-wins, `SetSpeed` clamps to [0.1, 20], `Stop` keeps the path and drops the queued request, `Resume` clears isStopped only, `IsPathStale` is O(1), `GetCurrentVelocity` returns `desiredVelocity` on XZ (CR-NAV-7 to 11, CR-NAV-16, EC-NAV-1, AC-NAV-08 to 13, 24)"
    created: 2026-11-12
    revised: ""
    status: active
  - id: TR-nav-005
    system: nav
    gdd: design/gdd/navigation-pathfinding.md
    requirement: "`SyncAgentPositions` (phase 1, sets `nextPosition`) and the `Tick` drain of at most `MAX_PATH_UPDATES_PER_TICK` requests (phase 2) run in the ADR-002 Decision 1 order; no code assumes a path on the tick it was requested (CR-NAV-12, CR-NAV-14, EC-NAV-7, EC-NAV-9, F-NAV-1, AC-NAV-14 to 16, 18)"
