    created: 2026-10-12
    revised: "2026-10-15"
    status: active
  - id: TR-cp-008
    system: cp
    gdd: design/gdd/character-persistence.md
    requirement: "CR-CP-8 — `CHARACTER_LOAD_TIMEOUT_SECONDS = 10` on `LoadCharacter`"
    created: 2026-10-12
    revised: ""
    status: active
  - id: TR-cp-009
