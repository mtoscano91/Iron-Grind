    note: "The server runs a fixed 20 Hz tick loop. 1.0s auto-attack cadence = 20 ticks per Beat. Respec TTL = 30s = 600 ticks. All systems that count time in ticks must use this constant. Changing TICK_RATE_HZ requires a full cross-system audit: auto-attack cadence, all tick-expressed timeouts, tick budget formula (F-NET-6), and the MAX_WRAP_WINDOW_TICKS bound in networking-owl-compensation.md CR-OWL-3. Safe range: [10, 30]. Do not change without coordinated cross-system review."
