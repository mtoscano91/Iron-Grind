# Technical Requirement ID Registry
#
# PURPOSE: Persistent, stable IDs for every GDD technical requirement.
# Prevents TR-ID renumbering across /architecture-review runs, which would
# break story references.
#
# RULES:
#   - IDs are PERMANENT. Never renumber, never delete (use status: deprecated).
#   - Add new entries only at the END of each system's list.
#   - When a GDD requirement is reworded (same intent): update `requirement`
#     text and add a `revised` date. The ID stays the same.
#   - When a requirement is removed from the GDD: set status: deprecated.
#   - When a requirement is split or replaced: set status: superseded-by with
#     the new TR-ID(s).
#
# WRITTEN BY: /architecture-review (appends new entries, never overwrites)
# READ BY:    /create-stories (embed IDs in stories)
#             /story-done (look up current requirement text at review time)
#             /story-readiness (validate TR-ID exists and is active)
#
# ID FORMAT: TR-[system-slug]-[NNN]
#   system-slug = short slug matching the GDD system name
#   NNN = three-digit zero-padded sequence per system, starting at 001
#
# STATUS VALUES: active | deprecated | superseded-by: TR-[system]-NNN

version: 2
last_updated: "2026-10-15"  # 107 TR-IDs registered from the 13 EPIC.md tables (/architecture-review, docs/architecture/architecture-review-2026-10-15-tr-registry.md); 7 carry a revised date

requirements:
  # --- auth: design/gdd/authentication.md (production/epics/authentication/EPIC.md) ---
  - id: TR-auth-001
    system: auth
    gdd: design/gdd/authentication.md
    requirement: "Full authentication = credential verification + AccountID→CharacterID resolution + session token issuance, all three complete before any game operation is permitted (CR-AUTH-1)"
    created: 2026-08-11
    revised: ""
    status: active
  - id: TR-auth-002
    system: auth
    gdd: design/gdd/authentication.md
    requirement: "`AccountID` is a `readonly struct` wrapping `uint`; `AccountID(0)` reserved/invalid; monotonic server-side counter, never reused, persisted independently from `CharacterID`'s counter (CR-AUTH-2/3)"
    created: 2026-08-11
    revised: ""
    status: active
  - id: TR-auth-003
    system: auth
    gdd: design/gdd/authentication.md
    requirement: "Authentication runs as a standalone .NET sidecar process (not the Unity IL2CPP binary), communicating via internal IPC named pipes (CR-AUTH-4)"
    created: 2026-08-11
    revised: ""
    status: active
  - id: TR-auth-004
    system: auth
    gdd: design/gdd/authentication.md
    requirement: "Password hashing via Argon2id (`Konscious.Security.Cryptography`), minimum `iterations=2, memorySize=19456KB, parallelism=1`, PHC string storage, 16-byte salt; bcrypt explicitly rejected (72-byte truncation defect) (CR-AUTH-5)"
    created: 2026-08-11
    revised: ""
    status: active
  - id: TR-auth-005
    system: auth
    gdd: design/gdd/authentication.md
    requirement: "Client sends plaintext credentials over TLS only; server hashes on receipt; client MUST NOT pre-hash; server MUST reject non-TLS connections (CR-AUTH-6)"
    created: 2026-08-11
    revised: ""
    status: active

