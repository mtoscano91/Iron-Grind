    unit: "seconds (5 minutes)"
    note: "Server-side session TTL for disconnected players (Disconnected_SessionActive state). Server preserves zone membership, HP, stats, gold, inventory, and active respec reservation for this duration after a client disconnect. After expiry: final state written to persistence, all session resources released. Character Persistence GDD must read this constant to understand the save-on-disconnect timing. Party System CR-PS-9 uses this value as the ghost party-slot TTL — ghost slots are released when SESSION_TTL_SECONDS expires. Safe range: [60, 600]. Below 60s: mobile reconnects experience frequent full reload cycles."
    added: "2026-05-02"
    revised: ""

  - name: GHOST_COMBAT_TTL_MINUTES
    status: active
    source: design/gdd/networking-core.md
    referenced_by:
