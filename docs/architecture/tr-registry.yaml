    gdd: design/gdd/character-persistence.md
    requirement: "CR-CP-9 — `CreateStub` writes a complete Level 1 record at registration; no first-login path in `LoadCharacter`"
    created: 2026-10-12
    revised: ""
    status: active
  - id: TR-cp-010
