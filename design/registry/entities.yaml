    type: "float constant (tuning knob)"
    value: 1
    unit: "minutes (ghost entity combat duration after disconnect)"
    note: "Minutes of auto-attack combat a ghost entity continues after entering Disconnected_SessionActive before disengaging. Default changed from 5 to 1 (2026-05-06) — 5-minute default created intentional-disconnect farming as a dominant strategy (~100 kills). At 1 minute ≈ 20 kills. Safe range: [0.5, 10]. Death & Respawn GDD must reference this constant: ghost-mode deaths (during the TTL window) have no death penalty per EC-NET-1. TTL tracked via tick arithmetic: ghostCombatExpiryTick = disconnectTickNumber + (GHOST_COMBAT_TTL_MINUTES × 60 × TICK_RATE_HZ)."
    added: "2026-05-06"
    revised: ""

  - name: GHOST_COMBAT_TTL_MIN_S
